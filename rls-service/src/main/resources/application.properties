spring.application.name=rls-service

# HTTP server (actuator/health only)
server.port=8091

# gRPC server — Envoy connects here
grpc.server.port=9090
grpc.server.security.enabled=false

# Redis (shared with write-api, read-api — same instance)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Rate limit configuration
# Write: 100 requests per 60-second sliding window per IP
app.ratelimit.write.limit=${RLS_WRITE_LIMIT:100}
app.ratelimit.write.window-ms=${RLS_WRITE_WINDOW_MS:60000}

# Read: 1000 requests per 60-second sliding window per IP
app.ratelimit.read.limit=${RLS_READ_LIMIT:1000}
app.ratelimit.read.window-ms=${RLS_READ_WINDOW_MS:60000}

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
