spring.application.name=analytics-worker
server.port=8082

# Actuator — expose health + prometheus for scraping
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=analytics-worker

# Kafka consumer
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.consumer.group-id=analytics-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Producers omit type headers (spring.json.add.type.headers=false)
# so we tell the deserializer to always deserialize as a HashMap
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# ClickHouse
app.clickhouse.url=${APP_CLICKHOUSE_URL:jdbc:clickhouse://localhost:8123/analytics?compress=0}
app.clickhouse.username=${APP_CLICKHOUSE_USERNAME:default}
app.clickhouse.password=${APP_CLICKHOUSE_PASSWORD:}
