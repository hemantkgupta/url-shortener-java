spring.application.name=analytics-worker

# Kafka consumer
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.consumer.group-id=analytics-worker
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Producers omit type headers (spring.json.add.type.headers=false)
# so we tell the deserializer to always deserialize as a HashMap
spring.kafka.consumer.properties.spring.json.value.default.type=java.util.HashMap

# ClickHouse
app.clickhouse.url=jdbc:clickhouse://localhost:8123/analytics?compress=0
app.clickhouse.username=default
app.clickhouse.password=
