server.port=8083
spring.application.name=analytics-api

# ClickHouse
app.clickhouse.url=jdbc:clickhouse://localhost:8123/analytics
app.clickhouse.username=default
app.clickhouse.password=

# Actuator — expose health + prometheus for scraping
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=analytics-api

# Google OAuth2 — same as write-api
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
