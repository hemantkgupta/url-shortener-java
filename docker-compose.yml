version: '3.9'

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9094:9094"   # external (host) listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── ClickHouse (analytics store) ──────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native TCP interface
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── PostgreSQL 16 (persistent URL store) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Write API (Java Spring Boot, port 8080) ────────────────────────────────
  write-api:
    build:
      context: .
      dockerfile: write-api/Dockerfile
    ports:
      - "8080:8080"   # kept for direct access / debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://localhost:8000
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: write-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Read API (Java Spring Boot, port 8081) ─────────────────────────────────
  read-api:
    build:
      context: .
      dockerfile: read-api/Dockerfile
    ports:
      - "8081:8081"   # kept for direct access / debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: read-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Analytics Worker (Kafka consumer → ClickHouse) ─────────────────────────
  analytics-worker:
    build:
      context: .
      dockerfile: analytics-worker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/analytics?compress=0
      APP_CLICKHOUSE_USERNAME: default
      APP_CLICKHOUSE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: analytics-worker
      OTEL_LOGS_EXPORTER: otlp

  # ── Analytics API (ClickHouse queries, port 8083) ─────────────────────────
  analytics-api:
    build:
      context: .
      dockerfile: analytics-api/Dockerfile
    ports:
      - "8083:8083"   # kept for direct access / debugging
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      APP_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default?compress=0
      APP_CLICKHOUSE_USERNAME: default
      APP_CLICKHOUSE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: analytics-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (React/Vite via Nginx, port 3000 internal only) ───────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # No external port — only accessed via the gateway
    depends_on:
      write-api:
        condition: service_healthy
      read-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy

  # ── Nginx API Gateway (single entry point, port 8000) ─────────────────────
  gateway:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - frontend
      - write-api
      - read-api
      - analytics-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SigNoz — dedicated ClickHouse for telemetry (traces, metrics, logs) ────
  clickhouse-signoz:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SigNoz — OTEL Collector (receives spans/metrics/logs on 4317/4318) ─────
  otel-collector:
    image: signoz/signoz-otel-collector:0.88.17
    command: ["--config=/etc/otel-collector-config.yaml"]
    user: root
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse-signoz:
        condition: service_healthy

  # ── SigNoz — Query Service (API, port 8085) ────────────────────────────────
  signoz-query-service:
    image: signoz/query-service:0.46.2
    command: ["-config=/root/config/prometheus.yml"]
    volumes:
      - ./signoz/prometheus.yml:/root/config/prometheus.yml:ro
    environment:
      ClickHouseUrl: tcp://clickhouse-signoz:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "false"
      DEPLOYMENT_TYPE: docker-standalone-amd
    ports:
      - "8085:8085"
      - "8086:8086"
    depends_on:
      clickhouse-signoz:
        condition: service_healthy

  # ── SigNoz — Frontend (Web UI at http://localhost:3301) ───────────────────
  signoz:
    image: signoz/frontend:0.46.2
    environment:
      FRONTEND_API_ENDPOINT: http://signoz-query-service:8085
    ports:
      - "3301:3301"
    depends_on:
      - signoz-query-service

volumes:
  postgres-data:   # persists URL data across docker-compose down/up
