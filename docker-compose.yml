version: '3.9'

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis/redis-stack-server:7.2.0-v10
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── etcd (worker-ID registry for Snowflake key gen) ───────────────────────
  etcd:
    image: bitnami/etcd:3.5
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    ports:
      - "2379:2379"
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    ports:
      - "9094:9094"   # external (host) listener
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ── ClickHouse (analytics store) ──────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    ports:
      - "8123:8123"   # HTTP interface
      - "9000:9000"   # native TCP interface
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s

  # ── PostgreSQL 16 (persistent URL store) ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    # Enable logical replication for Debezium CDC
    command: >
      postgres
      -c wal_level=logical
      -c max_replication_slots=5
      -c max_wal_senders=5
    environment:
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urluser -d urlshortener"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Key Generation Service (port 8085) ────────────────────────────────────
  key-gen-service:
    build:
      context: .
      dockerfile: key-gen-service/Dockerfile
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      etcd:
        condition: service_healthy
    environment:
      APP_KEY_GEN_STRATEGY: DUAL_BUFFER   # override to SNOWFLAKE to enable Snowflake IDs
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpass
      APP_KEY_GEN_ETCD_ENDPOINTS: http://etcd:2379
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: key-gen-service
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Write API (Java Spring Boot, port 8080) ────────────────────────────────
  write-api:
    build:
      context: .
      dockerfile: write-api/Dockerfile
    ports:
      - "8080:8080"   # kept for direct access / debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      key-gen-service:
        condition: service_healthy
    environment:
      APP_BASE_URL: http://localhost:8000
      APP_KEY_GEN_URL: http://key-gen-service:8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: write-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Read API (Java Spring Boot, port 8081) ─────────────────────────────────
  read-api:
    build:
      context: .
      dockerfile: read-api/Dockerfile
    ports:
      - "8081:8081"   # kept for direct access / debugging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/urlshortener
      SPRING_DATASOURCE_USERNAME: urluser
      SPRING_DATASOURCE_PASSWORD: urlpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: read-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Analytics Worker (Kafka consumer → ClickHouse) ─────────────────────────
  analytics-worker:
    build:
      context: .
      dockerfile: analytics-worker/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      APP_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/analytics?compress=0
      APP_CLICKHOUSE_USERNAME: default
      APP_CLICKHOUSE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: analytics-worker
      OTEL_LOGS_EXPORTER: otlp

  # ── CDC Worker (PostgreSQL WAL → Redis cache warm + Kafka) ───────────────
  cdc-worker:
    build:
      context: .
      dockerfile: cdc-worker/Dockerfile
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: urlshortener
      POSTGRES_USER: urluser
      POSTGRES_PASSWORD: urlpass
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: cdc-worker
      OTEL_LOGS_EXPORTER: otlp

  # ── Analytics API (ClickHouse queries, port 8083) ─────────────────────────
  analytics-api:
    build:
      context: .
      dockerfile: analytics-api/Dockerfile
    ports:
      - "8083:8083"   # kept for direct access / debugging
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      APP_CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/default?compress=0
      APP_CLICKHOUSE_USERNAME: default
      APP_CLICKHOUSE_PASSWORD: ""
      JAVA_TOOL_OPTIONS: "-javaagent:/app/opentelemetry-javaagent.jar"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_SERVICE_NAME: analytics-api
      OTEL_LOGS_EXPORTER: otlp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Rate Limit Service (gRPC :9090, HTTP actuator :8091) ─────────────────
  rls-service:
    build:
      context: .
      dockerfile: rls-service/Dockerfile
    ports:
      - "8091:8091"   # actuator (health, metrics)
      - "9090:9090"   # gRPC — Envoy connects here
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      RLS_WRITE_LIMIT: 100
      RLS_WRITE_WINDOW_MS: 60000
      RLS_READ_LIMIT: 1000
      RLS_READ_WINDOW_MS: 60000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Frontend (React/Vite via Nginx, port 3000 internal only) ───────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # No external port — only accessed via the gateway
    depends_on:
      write-api:
        condition: service_healthy
      read-api:
        condition: service_healthy
      analytics-api:
        condition: service_healthy

  # ── Envoy — Write API proxy (rate limit: 100 RPS) ─────────────────────────
  envoy-write:
    image: envoyproxy/envoy:v1.29-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy/envoy-write.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10000:10000"
    depends_on:
      write-api:
        condition: service_healthy
      rls-service:
        condition: service_healthy

  # ── Envoy — Read API proxy (rate limit: 1000 RPS, short-code validation) ──
  envoy-read:
    image: envoyproxy/envoy:v1.29-latest
    command: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "warn"]
    volumes:
      - ./envoy/envoy-read.yaml:/etc/envoy/envoy.yaml:ro
    ports:
      - "10001:10001"
    depends_on:
      read-api:
        condition: service_healthy
      rls-service:
        condition: service_healthy

  # ── Nginx API Gateway (single entry point, port 8000) ─────────────────────
  gateway:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - frontend
      - write-api
      - read-api
      - analytics-api
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/nginx-health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Flink — JobManager (cluster coordinator, Web UI at :8082) ─────────────
  flink-jobmanager:
    image: flink:1.18-java17
    command: jobmanager
    ports:
      - "8082:8081"   # Flink Web UI (8082 externally to avoid conflict)
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        state.backend: hashmap
        jobmanager.memory.process.size: 1024m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Flink — TaskManager (executes job tasks) ───────────────────────────────
  flink-taskmanager:
    image: flink:1.18-java17
    command: taskmanager
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
        taskmanager.memory.process.size: 1024m

  # ── Flink — Job Submitter (builds fat JAR and submits to cluster) ──────────
  flink-job-submitter:
    build:
      context: .
      dockerfile: flink-job/Dockerfile
    command: >
      /bin/bash -c "
        echo 'Waiting for Flink cluster...' &&
        sleep 15 &&
        /opt/flink/bin/flink run
          --jobmanager flink-jobmanager:8081
          /opt/flink-job/flink-job.jar
      "
    depends_on:
      flink-taskmanager:
        condition: service_started
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKHOUSE_URL: jdbc:clickhouse://clickhouse:8123/analytics?compress=0
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""

  # ── SigNoz — dedicated ClickHouse for telemetry (traces, metrics, logs) ────
  clickhouse-signoz:
    image: clickhouse/clickhouse-server:24.1.2-alpine
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── SigNoz — OTEL Collector (receives spans/metrics/logs on 4317/4318) ─────
  otel-collector:
    image: signoz/signoz-otel-collector:0.88.17
    command: ["--config=/etc/otel-collector-config.yaml"]
    user: root
    volumes:
      - ./signoz/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      clickhouse-signoz:
        condition: service_healthy

  # ── SigNoz — Unified image (query-service + frontend merged in v0.47+) ─────
  # Web UI: http://localhost:3301
  signoz:
    image: signoz/signoz:latest
    environment:
      ClickHouseUrl: tcp://clickhouse-signoz:9000
      STORAGE: clickhouse
      GODEBUG: netdns=go
      TELEMETRY_ENABLED: "false"
      DEPLOYMENT_TYPE: docker-standalone-amd
    ports:
      - "3301:8080"   # Web UI
      - "8085:8085"   # Query API
    depends_on:
      clickhouse-signoz:
        condition: service_healthy

volumes:
  postgres-data:   # persists URL data across docker-compose down/up
