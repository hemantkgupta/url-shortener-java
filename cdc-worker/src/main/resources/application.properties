spring.application.name=cdc-worker
server.port=8084

# PostgreSQL WAL source
app.postgres.host=${POSTGRES_HOST:postgres}
app.postgres.port=${POSTGRES_PORT:5432}
app.postgres.dbname=${POSTGRES_DB:urlshortener}
app.postgres.user=${POSTGRES_USER:urluser}
app.postgres.password=${POSTGRES_PASSWORD:urlpass}

# Redis (cache warming target)
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Kafka (publish url.created.cdc events)
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Actuator
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.show-details=always
