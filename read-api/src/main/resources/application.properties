server.port=8081
spring.application.name=read-api

# Connect to same H2 TCP server started by write-api
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:urlshortener
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=none

spring.h2.console.enabled=false

# Actuator — expose health + prometheus for scraping
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=read-api

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.redis.url-ttl-seconds=86400

# Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
