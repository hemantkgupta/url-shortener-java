server.port=8081
spring.application.name=read-api

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urlpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Schema is owned by write-api (Flyway) — read-api never touches DDL
spring.jpa.hibernate.ddl-auto=none

# ── HikariCP connection pool (read-heavy service) ─────────────────────────────
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
# Timeout for Redis connection (fail-open: proceed to DB on timeout)
spring.data.redis.timeout=10ms
app.redis.url-ttl-seconds=86400
# Hard timeout for individual Redis GET ops in RedirectService (ms)
app.redis.get-timeout-ms=10
# XFetch beta: higher = refresh earlier; 1.0 = standard decay
# With beta=1.0 and ttl=86400s, early refresh starts ~72min before expiry on avg
app.redis.xfetch-beta=1.0

# ── L1 Caffeine cache ─────────────────────────────────────────────────────────
# In-process cache: ~1µs hit vs ~1ms Redis. Short TTL (60s) bounds staleness
# for deleted/expired codes (CDC evicts Redis immediately but can't reach L1).
app.cache.l1.max-size=10000
app.cache.l1.ttl-seconds=60

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=read-api
