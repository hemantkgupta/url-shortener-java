# Use embedded H2 so tests don't need a running H2 TCP server
spring.datasource.url=jdbc:h2:mem:testread;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

app.redis.url-ttl-seconds=3600

# Kafka bootstrap pointing nowhere — KafkaTemplate is mocked
spring.kafka.bootstrap-servers=localhost:19999
