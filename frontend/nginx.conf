server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets directly (JS, CSS, images, fonts)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # All other requests → index.html so React Router handles routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
