# ─────────────────────────────────────────────────────────────────────────────
# HyperShort — Nginx API Gateway  (port 8000)
#
# Routing table:
#   POST /api/v1/shorten          → write-api:8080
#   GET  /api/v1/analytics/*      → analytics-api:8083
#   GET  /api/v1/history          → analytics-api:8083
#   GET  /{shortCode}             → read-api:8081  (302 redirect)
#   GET  /                        → frontend:80    (SPA catch-all)
#
# Strategy for short-code vs SPA routes:
#   Every request hits read-api first.  If read-api returns 404
#   (unknown code OR a known SPA path like /my-links), Nginx
#   transparently falls back to the frontend.  This means:
#     /abc123  → read-api → 302 ✓
#     /my-links → read-api → 404 → frontend → React renders /my-links ✓
#     /        → read-api → 404 → frontend → React renders home ✓
#
# Phase 6 — Observability:
#   X-Request-Id is generated here (using Nginx's built-in $request_id) if
#   the client did not supply one, then forwarded to every upstream service.
#   Services echo it back in their response and record it in MDC/logs.
# ─────────────────────────────────────────────────────────────────────────────

upstream write_api     { server write-api:8080; }
upstream read_api      { server read-api:8081; }
upstream analytics_api { server analytics-api:8083; }
upstream frontend_app  { server frontend:80; }

# Use the client-supplied X-Request-Id if present, otherwise fall back to
# Nginx's own per-request UUID ($request_id).
map $http_x_request_id $req_id {
    default   $http_x_request_id;
    ""        $request_id;
}

server {
    listen 8000;
    server_name _;

    # ── Write API ─────────────────────────────────────────────────────────
    location = /api/v1/shorten {
        proxy_pass         http://write_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $req_id;
    }

    # ── Analytics API — top links ─────────────────────────────────────────
    location /api/v1/analytics/ {
        proxy_pass         http://analytics_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $req_id;
    }

    # ── Analytics API — user history (exact match, auth required) ─────────
    location = /api/v1/history {
        proxy_pass         http://analytics_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Authorization     $http_authorization;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-Id      $req_id;
    }

    # ── Actuator health (for docker-compose healthchecks via gateway) ─────
    location /actuator/ {
        proxy_pass http://write_api;
    }

    # ── Short-code redirect + SPA fallback ───────────────────────────────
    # Try read-api first; on 404 silently serve the React SPA.
    location / {
        proxy_pass              http://read_api;
        proxy_set_header        Host            $host;
        proxy_set_header        X-Real-IP       $remote_addr;
        proxy_set_header        X-Request-Id    $req_id;
        proxy_intercept_errors  on;

        # read-api returned 404 (unknown code or a frontend route) → SPA
        error_page 404 = @spa;
    }

    location @spa {
        proxy_pass         http://frontend_app;
        proxy_set_header   Host $host;
    }
}
