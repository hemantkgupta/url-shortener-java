server.port=8080
spring.application.name=write-api

# ── PostgreSQL ────────────────────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urlpass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Flyway owns the schema — Hibernate only validates it matches the entity
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# ── HikariCP connection pool ──────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.base-url=${APP_BASE_URL:http://localhost:8000}
app.key-gen.url=${APP_KEY_GEN_URL:http://localhost:8085}
app.key-gen.connect-timeout-ms=${APP_KEY_GEN_CONNECT_TIMEOUT_MS:1000}
app.key-gen.read-timeout-ms=${APP_KEY_GEN_READ_TIMEOUT_MS:2000}

# ── Redis ─────────────────────────────────────────────────────────────────────
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
app.redis.url-ttl-seconds=86400

# ── Kafka ─────────────────────────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=write-api

app.cleanup.batch-size=5000
app.cleanup.fixed-delay-ms=3600000

# ── Google OAuth2 ─────────────────────────────────────────────────────────────
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
