server.port=8080
spring.application.name=write-api

# H2 in-memory database (shared with read-api via TCP server mode)
spring.datasource.url=jdbc:h2:tcp://localhost:9092/mem:urlshortener;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.base-url=http://localhost:8081

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
app.redis.url-ttl-seconds=86400

# Kafka
spring.kafka.bootstrap-servers=localhost:9094
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Google OAuth2 — verifies Bearer tokens signed by Google
# Spring Boot fetches Google's public keys automatically from this URI
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/oauth2/v3/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://accounts.google.com
