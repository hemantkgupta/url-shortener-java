# Embedded H2 for tests — production uses PostgreSQL
spring.datasource.url=jdbc:h2:mem:testwrite;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Dummy value — JwtDecoder is replaced by @MockBean in tests
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/test-jwk

# App settings for tests
app.base-url=http://localhost:8080
app.redis.url-ttl-seconds=3600

# Flyway disabled — H2 schema managed by hibernate ddl-auto=create-drop
spring.flyway.enabled=false

# Kafka bootstrap pointing nowhere — KafkaTemplate is mocked
spring.kafka.bootstrap-servers=localhost:19999
