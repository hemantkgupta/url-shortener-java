server.port=8085
spring.application.name=key-gen-service

# ── PostgreSQL (dual-buffer block counter) ────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/urlshortener
spring.datasource.username=urluser
spring.datasource.password=urlpass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# key-gen-service does NOT run Flyway — write-api owns the schema
spring.flyway.enabled=false

# ── Key generation strategy ────────────────────────────────────────────────────
# DUAL_BUFFER : pre-allocates blocks from Postgres, serves from in-memory buffers.
# SNOWFLAKE   : generates IDs locally using a Snowflake/HLC clock; worker ID from etcd.
app.key-gen.strategy=DUAL_BUFFER

# ── Short code encoding ────────────────────────────────────────────────────────
# All IDs are masked to 47 bits, XOR'd with this key, then bit-reversed before
# Base62 encoding.  Change this in production so short codes are unique to your
# deployment and non-predictable without the key (only lower 47 bits are used).
app.key-gen.obfuscation-key=47893471029

# ── Dual-buffer settings ───────────────────────────────────────────────────────
# IDs reserved per block from Postgres (larger = fewer DB round-trips).
# 10 000 means at most one DB call per 10 000 short codes created.
app.key-gen.dual-buffer.block-size=10000
# Fraction of current buffer consumed before the next block is pre-fetched (0.0-1.0)
app.key-gen.dual-buffer.prefetch-threshold=0.8

# ── Snowflake / HLC settings ───────────────────────────────────────────────────
# Custom epoch: 2024-01-01T00:00:00Z — shifts the 41-bit timestamp window 54 years
app.key-gen.snowflake.epoch-ms=1704067200000
# etcd endpoints (comma-separated)
app.key-gen.etcd.endpoints=http://localhost:2379
app.key-gen.etcd.lease-ttl-seconds=15
app.key-gen.etcd.worker-key-prefix=/key-gen/workers/
app.key-gen.etcd.max-worker-id=1023

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=key-gen-service
