server.port=8085
spring.application.name=key-gen-service

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:15432/urlshortener}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:urluser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:urlpass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Keep key-gen-service migrations isolated from the write-api Flyway history.
spring.flyway.table=key_gen_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.key-gen.strategy=${APP_KEY_GEN_STRATEGY:DUAL_BUFFER}
app.key-gen.obfuscation-key=${APP_KEY_GEN_OBFUSCATION_KEY:47893471029}
app.key-gen.dual-buffer.block-size=${APP_KEY_GEN_DUAL_BUFFER_BLOCK_SIZE:10000}
app.key-gen.dual-buffer.prefetch-threshold=${APP_KEY_GEN_DUAL_BUFFER_PREFETCH_THRESHOLD:0.8}
app.key-gen.snowflake.epoch-ms=${APP_KEY_GEN_SNOWFLAKE_EPOCH_MS:1704067200000}
app.key-gen.etcd.endpoints=${APP_KEY_GEN_ETCD_ENDPOINTS:http://localhost:2379}
app.key-gen.etcd.lease-ttl-seconds=${APP_KEY_GEN_ETCD_LEASE_TTL_SECONDS:15}
app.key-gen.etcd.worker-key-prefix=${APP_KEY_GEN_ETCD_WORKER_KEY_PREFIX:/key-gen/workers/}
app.key-gen.etcd.max-worker-id=${APP_KEY_GEN_ETCD_MAX_WORKER_ID:255}

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.metrics.tags.service=key-gen-service
